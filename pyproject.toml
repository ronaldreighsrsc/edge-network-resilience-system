[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniedge-sentinel"
version = "1.0.0"
description = "Autonomous IoT Telemetry, Roaming and Network Resilience System at the Edge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ronald Reigh", email = "ronaldreighsrsc@users.noreply.github.com" }
]
keywords = [
    "edge-computing",
    "network-resilience",
    "wi-fi-roaming",
    "mcda",
    "mlops",
    "iot-telemetry",
    "ssdp-upnp",
    "dns-self-healing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking :: Monitoring",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "psutil>=5.9.8",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.4.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.36.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=85"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/dashboard/*",  # Streamlit UI rendered via browser
    "src/core/interfaces.py",  # Abstract Base Classes / Protocols
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
